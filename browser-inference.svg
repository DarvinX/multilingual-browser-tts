<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="1020" viewBox="0 0 1140 1020" role="img" aria-labelledby="title desc">
<title id="title">Browser inference</title><desc id="desc">From choosing one model to playing speech locally in the browser.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M1 1 L7 4 L1 7 Z" fill="#526880"/></marker></defs>
<g font-family="Inter, system-ui, DejaVu Sans, sans-serif">
<rect x="0" y="0" width="1140" height="1020" rx="26" fill="#edf3fa" stroke="none" stroke-width="1.6"/>
<rect x="42" y="42" width="7" height="79" rx="3" fill="#3b65c6" stroke="none" stroke-width="1.6"/>
<text x="66" y="78" text-anchor="start" fill="#12203b" font-size="40" font-weight="750">Browser inference</text>
<text x="68" y="112" text-anchor="start" fill="#41516c" font-size="18" font-weight="400">From choosing one model to playing speech locally in the browser.</text>
<rect x="42" y="150" width="356" height="795" rx="18" fill="#ffffff" stroke="#d4dce9" stroke-width="1.6"/>
<text x="70" y="188" text-anchor="start" fill="#12203b" font-size="24" font-weight="720">1  Load model</text>
<text x="70" y="213" text-anchor="start" fill="#41516c" font-size="15" font-weight="400">Select one language and precision</text>
<rect x="422" y="150" width="676" height="795" rx="18" fill="#ffffff" stroke="#d4dce9" stroke-width="1.6"/>
<text x="450" y="188" text-anchor="start" fill="#12203b" font-size="24" font-weight="720">2  Press Play</text>
<text x="450" y="213" text-anchor="start" fill="#41516c" font-size="15" font-weight="400">Text and audio stay inside the browser</text>
<rect x="64" y="234" width="312" height="61" rx="12" fill="#e6f0fe" stroke="#80a9e8" stroke-width="1.6"/>
<text x="220.0" y="260.5" text-anchor="middle" fill="#12203b" font-size="18" font-weight="680">Choose a voice and precision</text>
<text x="220.0" y="280.5" text-anchor="middle" fill="#41516c" font-size="15" font-weight="420">Then press Load model</text>
<polyline points="220,295 220,321" stroke="#526880" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="64" y="323" width="312" height="117" rx="12" fill="#e6f0fe" stroke="#80a9e8" stroke-width="1.6"/>
<text x="220.0" y="357.5" text-anchor="middle" fill="#12203b" font-size="18" font-weight="680">Fetch the selected bundle</text>
<text x="220.0" y="377.5" text-anchor="middle" fill="#41516c" font-size="15" font-weight="420">Compressed ONNX graph</text>
<text x="220.0" y="397.5" text-anchor="middle" fill="#41516c" font-size="15" font-weight="420">Packed weights and language frontend</text>
<text x="220.0" y="417.5" text-anchor="middle" fill="#41516c" font-size="15" font-weight="420">Shared WebAssembly runtime</text>
<polyline points="220,440 220,467" stroke="#526880" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="64" y="469" width="312" height="80" rx="12" fill="#efe9ff" stroke="#a996df" stroke-width="1.6"/>
<text x="220.0" y="495.0" text-anchor="middle" fill="#12203b" font-size="18" font-weight="680">Decompress and unpack</text>
<text x="220.0" y="515.0" text-anchor="middle" fill="#41516c" font-size="15" font-weight="420">Expand the selected weights</text>
<text x="220.0" y="535.0" text-anchor="middle" fill="#41516c" font-size="15" font-weight="420">for the runtime session</text>
<polyline points="220,549 220,576" stroke="#526880" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="64" y="578" width="312" height="66" rx="12" fill="#efe9ff" stroke="#a996df" stroke-width="1.6"/>
<text x="220.0" y="607.0" text-anchor="middle" fill="#12203b" font-size="18" font-weight="680">Voice session ready</text>
<text x="220.0" y="627.0" text-anchor="middle" fill="#41516c" font-size="15" font-weight="420">ONNX Runtime Web in a worker</text>
<polyline points="376,610 411,610 411,677 445,677" stroke="#526880" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="5 6"/>
<rect x="448" y="233" width="592" height="58" rx="12" fill="#e6f0fe" stroke="#80a9e8" stroke-width="1.6"/>
<text x="744.0" y="258.0" text-anchor="middle" fill="#12203b" font-size="18" font-weight="680">Enter text and choose speed</text>
<text x="744.0" y="278.0" text-anchor="middle" fill="#41516c" font-size="15" font-weight="420">Native script, Roman input, or English text</text>
<polyline points="744,291 744,316" stroke="#526880" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="448" y="318" width="592" height="62" rx="12" fill="#fff2dc" stroke="#d8a45e" stroke-width="1.6"/>
<text x="744.0" y="345.0" text-anchor="middle" fill="#12203b" font-size="18" font-weight="680">Normalize text and convert Roman input when needed</text>
<text x="744.0" y="365.0" text-anchor="middle" fill="#41516c" font-size="15" font-weight="420">Split the normalized text into sentences</text>
<polyline points="744,380 744,394 589,394 589,420" stroke="#526880" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="448" y="422" width="282" height="72" rx="12" fill="#e3f5f1" stroke="#71b8ac" stroke-width="1.6"/>
<text x="589.0" y="454.0" text-anchor="middle" fill="#12203b" font-size="18" font-weight="680">Pronunciation lexicon</text>
<text x="589.0" y="474.0" text-anchor="middle" fill="#41516c" font-size="15" font-weight="420">Look up phones and stress</text>
<polyline points="730,458 762,458" stroke="#526880" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="764" y="414" width="276" height="86" rx="12" fill="#efe9ff" stroke="#a996df" stroke-width="1.6"/>
<text x="902.0" y="443.0" text-anchor="middle" fill="#12203b" font-size="18" font-weight="680">ONNX G2P fallback</text>
<text x="902.0" y="463.0" text-anchor="middle" fill="#41516c" font-size="15" font-weight="420">Unknown words only</text>
<text x="902.0" y="483.0" text-anchor="middle" fill="#41516c" font-size="15" font-weight="420">BiGRU encoder → attentive GRU</text>
<polyline points="589,494 589,520 744,520 744,543" stroke="#526880" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="902,500 902,520 744,520" stroke="#526880" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="448" y="545" width="592" height="60" rx="12" fill="#e3f5f1" stroke="#71b8ac" stroke-width="1.6"/>
<text x="744.0" y="571.0" text-anchor="middle" fill="#12203b" font-size="18" font-weight="680">Build phone and stress tensors</text>
<text x="744.0" y="591.0" text-anchor="middle" fill="#41516c" font-size="15" font-weight="420">Split long sequences and pass voice ID and speed</text>
<polyline points="744,605 744,633" stroke="#526880" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="448" y="635" width="592" height="81" rx="12" fill="#efe9ff" stroke="#a996df" stroke-width="1.6"/>
<text x="744.0" y="661.5" text-anchor="middle" fill="#12203b" font-size="18" font-weight="680">Run the acoustic model for each chunk</text>
<text x="744.0" y="681.5" text-anchor="middle" fill="#41516c" font-size="15" font-weight="420">Phone encoder → duration and prosody stacks</text>
<text x="744.0" y="701.5" text-anchor="middle" fill="#41516c" font-size="15" font-weight="420">→ source-filter waveform and residual refiner</text>
<polyline points="744,716 744,744" stroke="#526880" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="448" y="746" width="592" height="58" rx="12" fill="#ffede6" stroke="#d99483" stroke-width="1.6"/>
<text x="744.0" y="771.0" text-anchor="middle" fill="#12203b" font-size="18" font-weight="680">Join chunks and limit peaks</text>
<text x="744.0" y="791.0" text-anchor="middle" fill="#41516c" font-size="15" font-weight="420">Return a 24 kHz waveform to the page</text>
<polyline points="744,804 744,831" stroke="#526880" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="448" y="833" width="592" height="64" rx="12" fill="#e6f0fe" stroke="#80a9e8" stroke-width="1.6"/>
<text x="744.0" y="861.0" text-anchor="middle" fill="#12203b" font-size="18" font-weight="680">Encode WAV and play</text>
<text x="744.0" y="881.0" text-anchor="middle" fill="#41516c" font-size="15" font-weight="420">The same WAV is available to download</text>
<text x="67" y="747" text-anchor="start" fill="#12203b" font-size="18" font-weight="680">997,518 bytes for Bengali INT8</text>
<text x="67" y="775" text-anchor="start" fill="#41516c" font-size="15" font-weight="400">Graph, packed weights, and unpacker.</text>
<text x="67" y="801" text-anchor="start" fill="#41516c" font-size="15" font-weight="400">The frontend and runtime load separately.</text>
<text x="47" y="982" text-anchor="start" fill="#41516c" font-size="15" font-weight="400">G2P = grapheme-to-phoneme. The browser loads the fallback model on demand.</text>
</g>
</svg>
